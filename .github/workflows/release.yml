# Builds the APK and, for a version tag (v0.1.0), publishes it as a GitHub
# Release. Manual runs build the APK without publishing. See
# docs/android.md for the release steps and signing secrets.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: The tag matches the app version
        run: |
          version="$(sed -n 's/^version: \([0-9.]*\).*/\1/p' app/pubspec.yaml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match app/pubspec.yaml version $version"
            exit 1
          fi
      # The build number is Android's versionCode, and Android refuses an
      # update whose versionCode is lower than the installed one.
      - name: The build number is above the previous release's
        run: |
          build_of() { sed -n 's/^version: [0-9.]*+\([0-9]*\).*/\1/p'; }
          build="$(build_of < app/pubspec.yaml)"
          if [[ -z "$build" ]]; then
            echo "::error::app/pubspec.yaml version has no build number (+N)"
            exit 1
          fi
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -1 || true)"
          if [[ -n "$previous" ]]; then
            previous_build="$(git show "$previous:app/pubspec.yaml" | build_of)"
            echo "build $build, $previous had ${previous_build:-none}"
            if (( build <= ${previous_build:-0} )); then
              message="build number $build is not above $previous's ${previous_build}"
              if [[ "$GITHUB_REF_TYPE" == tag ]]; then echo "::error::$message"; exit 1; fi
              echo "::warning::$message; raise it before tagging"
            fi
          fi

  android:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # A debug-signed APK cannot update, or be updated by, any other
      # build, so without the release key the release is a prerelease.
      - id: signing
        name: Check for the Android signing secrets
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE is not set; the APK is debug-signed and the release is a prerelease (docs/android.md)"
          fi
      - name: Build APK (release-signed when the secrets are set)
        run: scripts/package-android
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Checksums
        working-directory: app/build/dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: app/build/dist/

  publish:
    if: github.ref_type == 'tag'
    needs: [version, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: yft-android-utils ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.android.outputs.signed != 'true' }}
          body: ${{ needs.android.outputs.signed != 'true' && 'This APK is signed with the debug key, so it cannot update, or be updated by, a release-signed install.' || '' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
